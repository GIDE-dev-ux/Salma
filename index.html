<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8"><meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

  <title>CyberGuard AI</title>  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="style.css">  <!-- Markdown -->  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>  <script>
    marked.setOptions({
      breaks: true
    });
  </script>  <!-- Highlight.js -->  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css"
  >  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script></head><body>  <div class="app"><!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <div class="sidebar-header">
    <button type="button" id="newChatBtn">
      + New Chat
    </button>
  </div>

  <div class="chat-list" id="chatList"></div>

  <div class="sidebar-footer">

    <select id="modelSelector">

      <option value="llama-3.3-70b-versatile">
        Llama 3.3 70B
      </option>

      <option value="llama-3.1-8b-instant">
        Llama 3.1 8B
      </option>

      <option value="deepseek-r1-distill-llama-70b">
        DeepSeek R1
      </option>

    </select>

    <button type="button" id="exportBtn">
      Export Chat
    </button>

  </div>

</aside>

<!-- Sidebar Overlay -->
<div id="sidebarOverlay"></div>

<!-- MAIN -->
<main class="main">

  <div class="header">

    <button
      type="button"
      id="menuBtn"
      aria-label="Open menu"
    >
      ☰
    </button>

    <img
      src="/favicon.png"
      alt="CyberGuard AI"
      class="logo"
    >

    <h2>CyberGuard AI</h2>

    <button
      type="button"
      id="clearChatBtn"
      aria-label="Clear chat"
    >
      🗑️
    </button>

  </div>

  <div class="chat-container">

    <div
      class="messages"
      id="chatContainer"
    ></div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask CyberGuard AI..."
        autocomplete="off"
        spellcheck="false"
      >

      <button
        type="button"
        id="sendBtn"
        aria-label="Send message"
      >
        ➤
      </button>

    </div>

  </div>

</main>

</div>  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="script.js"></script>
</body>
</html>
