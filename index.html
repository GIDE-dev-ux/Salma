<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>
  <title>BABI-Bot</title>

  <link rel="icon" href="/favicon.png"/>
  <link rel="stylesheet" href="style.css"/>

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <script>
marked.setOptions({
  breaks: true
});
</script>

  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/highlight.min.js"></script>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <button id="newChatBtn">+ New Chat</button>
    </div>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">

      <select id="modelSelector">
        <option value="llama-3.3-70b-versatile">
          Llama 3.3 70B
        </option>

        <option value="llama-3.1-8b-instant">
          Llama 3.1 8B
        </option>

        <option value="deepseek-r1-distill-llama-70b">
          DeepSeek R1
        </option>
      </select>

      <button id="exportBtn">
        Export Chat
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="header">

      <button id="menuBtn">☰</button>

      <img src="/favicon.png" class="logo" />

      <h2>CyberGuard AI</h2>

      <button id="clearChatBtn">🗑️</button>

    </div>

    <div class="chat-container">

      <div class="messages" id="chatContainer"></div>

      <div class="input-area">

        <input
          type="text"
          id="userInput"
          placeholder="Ask CyberGuard AI..."
          autocomplete="off"
        />

        <button id="sendBtn">➤</button>

      </div>

    </div>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
